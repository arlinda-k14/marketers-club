<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel — Marketers Club</title>
  <link rel="stylesheet" href="/styles/main.css">
</head>
<body>
  <nav class="nav">
    <div class="nav-bar">
      <a href="/" class="nav-logo"><span class="nav-logo-badge">MC</span><span>Marketers Club</span></a>
      <button class="nav-toggle" onclick="document.querySelector('.nav-links').classList.toggle('open')">Menu</button>
      <div class="nav-links">
        <a href="/events.html">Events</a>
        <a href="/hire-marketers.html">Hire Marketers</a>
        <a href="/blog.html">Blog</a>
        <a href="/newsletter.html">Newsletter</a>
        <a href="/admin-dashboard.html">Admin Dashboard</a>
        <a href="/sign-in.html" class="btn btn-sm">Member Login</a>
      </div>
    </div>
  </nav>
  <main class="container section">
    <div style="margin-bottom: 2rem;">
      <span class="pill">✦ Admin Panel</span>
      <h1>Publish Content</h1>
    </div>
    <div class="grid grid-2">
      <div class="card">
        <h3 style="margin-bottom: 1rem;">Publish Article</h3>
        <form id="article-form">
          <div class="form-group"><label>Title</label><input name="title" required></div>
          <div class="form-group"><label>Excerpt</label><input name="excerpt" required></div>
          <div class="form-group"><label>Category</label><input name="category" required></div>
          <div class="form-group"><label>Tags (comma separated)</label><input name="tags" placeholder="Growth Marketing, AI Tools"></div>
          <div class="form-group"><label>Content</label><textarea name="content" required></textarea></div>
          <button type="submit" class="btn">Publish Article</button>
        </form>
        <p id="article-status" style="margin-top: 1rem;"></p>
      </div>
      <div class="card">
        <h3 style="margin-bottom: 1rem;">Publish Newsletter Issue</h3>
        <form id="newsletter-form">
          <div class="form-group"><label>Issue Number</label><input type="number" name="issueNumber" required></div>
          <div class="form-group"><label>Tags (comma separated)</label><input name="tags" placeholder="SEO, Growth Marketing"></div>
          <div class="form-group"><label>Tips (one per line)</label><textarea name="tips" required></textarea></div>
          <button type="submit" class="btn">Publish Issue</button>
        </form>
        <p id="newsletter-pub-status" style="margin-top: 1rem;"></p>
      </div>
    </div>
  </main>
  <script type="module" src="/assets/js/admin-panel.bundle.js"></script>
</body>
</html>
